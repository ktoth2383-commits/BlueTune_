name: Windows build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verziószám
        shell: pwsh
        run: |
          $v = "1.1.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (egyetlen .exe, .NET-tel együtt)
        shell: pwsh
        run: |
          dotnet publish desktop/BlueTune.Desktop/BlueTune.Desktop.csproj `
            -c Release -o dist -p:Version=$env:APP_VERSION

      - name: Csomagolás + ellenőrzőösszeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/BlueTune.exe out/BlueTune.exe
          $h = (Get-FileHash out/BlueTune.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BlueTune.exe" | Out-File out/SHA256SUMS-windows.txt -Encoding ascii
          "### BlueTune.exe`n``$h``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Item out/BlueTune.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BlueTune-windows
          path: out/*

      - name: GitHub Release (csak v* tagnél)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/BlueTune.exe
            out/SHA256SUMS-windows.txt
