name: iOS build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode verzió
        run: xcodebuild -version

      - name: XcodeGen telepítése
        run: brew install xcodegen

      - name: Firebase config (opcionális – GOOGLE_SERVICE_INFO_PLIST secret)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            printf '%s' "$PLIST" > ios/BlueTune/GoogleService-Info.plist
            echo "Firebase konfiguráció hozzáadva."
          else
            echo "::warning::Nincs GOOGLE_SERVICE_INFO_PLIST secret – Firebase (fiók) nélkül buildelünk."
          fi

      - name: Xcode projekt generálása
        working-directory: ios
        run: |
          VERSION="1.1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml
          xcodegen generate

      - name: Swift csomagok (Firebase) letöltése
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project BlueTune.xcodeproj -scheme BlueTune -skipPackagePluginValidation

      - name: Build (aláírás nélkül)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlueTune.xcodeproj \
            -scheme BlueTune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*BlueTune/|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BlueTune.app

      - name: Aláíratlan IPA összeállítása
        working-directory: ios
        run: |
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/BlueTune.app Payload/
          zip -qry out/BlueTune-unsigned.ipa Payload
          shasum -a 256 out/BlueTune-unsigned.ipa | tee out/SHA256SUMS-ios.txt
          ls -la out

      - name: Build napló (hiba esetén)
        if: failure()
        working-directory: ios
        run: tail -n 200 build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: BlueTune-ios
          path: ios/out/*

      - name: GitHub Release (csak v* tagnél)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/out/BlueTune-unsigned.ipa
            ios/out/SHA256SUMS-ios.txt
